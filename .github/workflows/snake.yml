name: Generate Pokemon Grid Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: badjuvi6
          outputs: |
            github-snake-dark.svg?palette=github-dark&color_snake=%2300F5FF&color_dots=%23161b22,%23003b46,%23006677,%230099b8,%2300f5ff

      - name: Commit and Push Snake SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-snake-dark.svg
          git commit -m "Update snake animation" || exit 0
          git push
